<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Aiko Teste
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="assets/img/aiko.png" type="image/x-icon">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        #sidebar-container a span {
            display: none;
        }

        #sidebar-config {
            transform: rotate(-90deg);
        }

        @media (min-width: 640px) {
            #sidebar-container a span {
                display: block;
            }

            #sidebar-config {
                transform: rotate(0deg);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "aiko-purple": "#003184",
                        "aiko-green": "#02E002",
                    }
                }
            }
        }
    </script>

</head>

<body class="bg-gray-100">
    <div class="flex h-screen p-4 sm:flex-row flex-col">
        <!-- Sidebar -->
        <aside id="sidebar-container"
            class="rounded-lg sm:w-64 w-full mb-4 sm:mb-0 bg-white border-r shadow-md shadow-xs border-gray-200 flex flex-col transition-all duration-300">
            <!-- Header with logo -->
            <div class="px-4 py-3 flex items-center border-b border-gray-200">
                <div class="flex items-center">
                    <div class="w-16 h-12 rounded-md flex items-center justify-center text-white disable-sidebar"
                        id="disable-sidebar-logo">
                        <img src="assets/img/aiko.png" alt="logo aiko">
                    </div>
                </div>
                <button class="ml-auto text-blue-500 select-none outline-none transition-all duration-100" id="sidebar-config">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <div class="flex-1 h-ful" id="sidebar-icons">
                <nav class="py-2 flex sm:flex-col flex-row justify-around transition-all duration-200">

                    <a href="index.html" title="Como funciona o desafio?" class="flex items-center px-4 py-2 text-aiko-purple sidebar-item">
                        <i class="fas fa-home w-5"></i>
                        <span class="ml-2 text-gray-500 disable-sidebar">Desafio</span>
                    </a>

                    <a href="desafio.html" title="Parte do desafio" class="flex items-center px-4 py-2 text-aiko-purple sidebar-item relative">
                        <i class="fas fa-tasks w-5"></i>
                        <span class="ml-2 text-gray-500 disable-sidebar">Dashboard</span>

                    </a>
                </nav>


            </div>
        </aside>


        <!-- Main content -->
        <main class="sm:ml-4 ml-0 w-full rounded-lg w-64 border-r shadow-md shadow-xs border-gray-200 flex flex-col">
            <div class="relative bg-white py-4 px-4">
                <h1 class="text-4xl my-4 text-aiko-purple">Dashboard</h1>
                <hr>


                <div class="mb-4 w-full mt-4 flex flex-col md:flex-row gap-2">
                    <input type="text" id="searchInput" placeholder="Pesquisar geral..." class="w-full md:w-2/5 px-4 py-2 border rounded-md shadow-sm focus:outline-none" />

                    <select id="filterProductName" class="w-full md:w-1/5 px-4 py-2 border rounded-md shadow-sm focus:outline-none">
                        <option value="">Filtre pelo Equipamento</option>
                        <option value="Caminhão de carga">Caminhão de carga</option>
                        <option value="Harvester">Harvester</option>
                        <option value="Garra traçadora">Garra traçadora</option>
                    </select>

                    <select id="filterState" class="w-full md:w-1/5 px-4 py-2 border rounded-md shadow-sm focus:outline-none">
                        <option value="">Filtre pelo status</option>
                        <option value="Operando">Operando</option>
                        <option value="Manutenção">Manutenção</option>
                        <option value="Parado">Parado</option>
                    </select>
                </div>

                <div class="overflow-y-auto" style="max-height: 300px; min-height: 300px">
                    <table class="w-full text-sm text-left rtl:text-right text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3">Código</th>
                                <th class="px-6 py-3">Equipamento</th>
                                <th class="px-6 py-3">Status</th>
                                <th class="px-6 py-3 w-72">Localização</th>
                                <th class="px-6 py-3 w-8"></th>
                            </tr>
                        </thead>
                        <tbody id="equipmentTableBody">
                            <!-- Dados de exemplo -->
                        </tbody>
                    </table>
                </div>


                <script>
                    const searchInput = document.getElementById('searchInput');
                    const filterProduct = document.getElementById('filterProductName');
                    const filterState = document.getElementById('filterState');

                    searchInput.addEventListener('input', filterTable);
                    filterProduct.addEventListener('change', filterTable);
                    filterState.addEventListener('change', filterTable);

                    function filterTable() {
                        const searchText = searchInput.value.toLowerCase();
                        const productFilter = filterProduct.value;
                        const stateFilter = filterState.value;

                        const rows = document.querySelectorAll('#equipmentTableBody tr');

                        rows.forEach(row => {
                            const codigo = row.cells[0]?.innerText.toLowerCase();
                            const Equipamento = row.cells[1]?.innerText.trim().toLowerCase();
                            const status = row.cells[2]?.querySelector('button')?.innerText.trim().toLowerCase() || '';
                            const localizacao = row.cells[3]?.innerText.toLowerCase();

                            const fullText = `${codigo} ${Equipamento} ${status} ${localizacao}`;

                            const matchesSearch = fullText.includes(searchText);
                            const matchesProduct = !productFilter || Equipamento === productFilter.toLowerCase();
                            const matchesState = !stateFilter || status === stateFilter.toLowerCase();

                            // Só mostra se bate com a busca E os filtros (se estiverem definidos)
                            const shouldShow = matchesSearch && matchesProduct && matchesState;

                            row.style.display = shouldShow ? '' : 'none';
                        });
                    }
                </script>


            </div>
            <div class="relative bg-white py-4 px-4 mt-4 sm:h-full h-[300px] mb-16">
                <div id="map" class="w-100 h-full"></div>

                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
                <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

                <script>
                    let mapa; // variáveis globais
                    let marcadores = [];

                    // Inicializa o mapa só uma vez
                    function inicializarMapa(latInicial = 0, lonInicial = 0, zoom = 2) {
                        if (!mapa) {
                            mapa = L.map('map').setView([latInicial, lonInicial], zoom);

                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '&copy; OpenStreetMap contributors'
                            }).addTo(mapa);
                        }
                    }

                    function marcarNoMapa(lat, lon, texto, type) {

                        let iconMarker = getIconByType(type);

                        inicializarMapa(lat, lon, 13); // chama uma vez só
                        const marcador = L.marker([lat, lon], {
                            icon: iconMarker
                        }).addTo(mapa);

                        marcador.bindPopup(texto);
                        marcadores.push(marcador);
                    }

                    function getIconByType(type) {
                        let iconUrl;

                        switch (type.toLowerCase()) {
                            case 'harvester':
                                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png';
                                break;
                            case 'garra traçadora':
                                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png';
                                break;
                            case 'caminhão de carga':
                                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png';
                                break;
                            default:
                                iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png';
                        }

                        return L.icon({
                            iconUrl: iconUrl,
                            shadowUrl: 'https://unpkg.com/leaflet@1.9.3/dist/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        });
                    }
                </script>
            </div>
            <!-- Modal -->
            <div id="estadoModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[99999] hidden">
                <div class="bg-white rounded-lg p-6 sm:w-full w-[90%] max-w-lg shadow-lg relative">
                    <button onclick="fecharModal()" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">
                        &times;
                    </button>
                    <h2 class="text-xl font-bold mb-4" id="title-modal">Histórico do Equipamento</h2>
                    <div id="modalContent" class="space-y-2 overflow-auto max-h-[500px] p-4">
                        <!-- Os dados serão injetados aqui -->
                    </div>
                </div>
            </div>
        </main>

    </div>

    <script src="assets/scripts/dados.js" defer></script>
    <script src="assets/scripts/sidebar.js" defer></script>
    <script src="assets/scripts/table.js"></script>

</body>

</html>
